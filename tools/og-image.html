<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG image</title>
<link rel="stylesheet" href="/fonts/site-fonts.css" />
<link rel="stylesheet" href="/fonts/fonts.css" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: #07070a; }
  body { position: relative; overflow: hidden; color: #f4f4f5; font-family: 'Saira', sans-serif; }
  .glow { position: absolute; right: -140px; top: -160px; width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(77,124,255,.34), transparent 64%); }
  .glow2 { position: absolute; left: -220px; bottom: -300px; width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(34,211,238,.14), transparent 66%); }
  /* the gate: two rings, as in the site's corridor */
  .ring { position: absolute; right: 70px; top: 82px; width: 470px; height: 470px; border-radius: 50%;
    border: 2px solid #4d7cff; box-shadow: 0 0 40px rgba(77,124,255,.55), inset 0 0 40px rgba(77,124,255,.25); }
  .ring.b { right: 150px; top: 162px; width: 310px; height: 310px; border: 1px solid rgba(34,211,238,.8);
    box-shadow: 0 0 26px rgba(34,211,238,.4); }
  .ring.c { right: 215px; top: 227px; width: 180px; height: 180px; border: 1px solid rgba(159,184,255,.5); box-shadow: none; }
  .frame { position: absolute; inset: 26px; border: 1px solid rgba(255,255,255,.09); border-radius: 22px; }
  .in { position: absolute; inset: 0; padding: 60px 76px 72px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 22px; font-family: 'JetBrains Mono', monospace; font-size: 19px;
    letter-spacing: .3em; text-transform: uppercase; color: #9a9aa3; }
  .mono { width: 62px; height: 62px; border-radius: 15px; border: 1px solid rgba(159,184,255,.4);
    background: rgba(77,124,255,.14); display: grid; place-items: center;
    font-family: 'Noto Sans Armenian', sans-serif; font-weight: 500; font-size: 24px; letter-spacing: 0; color: #f4f4f5; }
  .badges { margin-top: 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .badge { padding: 9px 20px; border: 1px solid rgba(229,192,123,.5); border-radius: 4px; background: rgba(229,192,123,.07);
    font-family: 'JetBrains Mono', monospace; font-size: 16px; letter-spacing: .14em; text-transform: uppercase; color: #e5c07b; }
  h1 { margin-top: auto; font-family: 'Saira Condensed', sans-serif; font-weight: 900; font-size: 122px; line-height: .86;
    letter-spacing: -.01em; text-transform: uppercase; }
  .role { margin-top: 22px; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: .02em;
    text-transform: uppercase; }
  .role b { color: #9fb8ff; font-weight: 700; }
  .stack { margin-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 19px; letter-spacing: .06em; color: #b8b8c0; }
  .foot { margin-top: 18px; display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace;
    font-size: 17px; letter-spacing: .14em; }
  .foot a { color: #4d7cff; text-decoration: none; }
  .foot span { color: #75757e; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="ring"></div><div class="ring b"></div><div class="ring c"></div>
  <div class="frame"></div>
  <div class="in">
    <div class="top"><div class="mono">Է|Հ</div>Edgar Hovsepyan · Portfolio</div>
    <div class="badges">
      <div class="badge">SBC Awards Americas 2025 · GotY shortlist</div>
      <div class="badge">B.F.T.H. Arena Awards 2024 · Finalist</div>
    </div>
    <h1>Edgar<br />Hovsepyan</h1>
    <div class="role">Senior iGaming Engineer · <b>Games, Platform and Tooling</b></div>
    <div class="stack">PixiJS / Three.js · TypeScript · C#/.NET · Kubernetes</div>
    <div class="foot"><a>edgarhovsepyan.github.io</a><span>Yerevan, Armenia · Remote worldwide</span></div>
  </div>
</body>
</html>
